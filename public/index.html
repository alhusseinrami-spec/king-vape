}
html[dir=rtl]{--font-display:"Cairo","Segoe UI",system-ui,sans-serif;--font-body:"Cairo","DM Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--ink);color:var(--text);font:400 15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
bdi.n{unicode-bidi:isolate;direction:ltr}

/* ---------- brand bar */
.brandbar{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1b2029,var(--ink))}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:54px;height:54px;border-radius:14px;background:var(--logo) center/cover no-repeat;border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));box-shadow:0 6px 18px rgba(0,0,0,.45)}
.brand b{display:block;font:400 25px/1.05 var(--font-display);letter-spacing:.02em;color:var(--gold)}
html[dir=rtl] .brand b{font-weight:800;letter-spacing:0;font-size:23px}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:12.5px}
.tag2{display:none}
@media (min-width:500px){.tag2{display:inline}}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.pill{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.pill:hover{border-color:var(--gold)}
.pill svg{width:18px;height:18px}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.cartbtn{position:relative;padding:0}
.cartbtn svg{width:21px;height:21px}
.cartbtn .c{position:absolute;top:-5px;inset-inline-end:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--gold-fill);color:var(--gold-ink);font:700 12px/20px var(--font-body);text-align:center}

/* ---------- sticky strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.search{position:relative;padding-block:10px 8px}
.search svg{position:absolute;inset-inline-start:14px;top:calc(50% + 1px);translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;padding-block:0;padding-inline:40px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--gold);outline:none}
.tabs,.subs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar,.subs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 14px var(--font-body);display:inline-flex;align-items:center;gap:7px}
.tab .ct{font-weight:500;font-variant-numeric:tabular-nums;opacity:.75}
.tab .ar{font:800 15px/1 "Cairo",var(--font-body)}
.tab[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold);color:var(--gold-ink)}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:500 13px var(--font-body)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* ---------- catalogue */
main{padding-block:20px 130px}
.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{margin:0;font:400 clamp(26px,5.5vw,34px)/1.15 var(--font-display);letter-spacing:.01em;text-wrap:balance}
html[dir=rtl] h1{font-weight:800;letter-spacing:0}
.count{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.intro{margin:0 0 18px;color:var(--muted);max-width:56ch}
.grid{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:16px}}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;position:relative;cursor:pointer;border-radius:16px;border:1px solid var(--line);background:var(--panel);transition:border-color .15s}
.card:hover{border-color:var(--gold)}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.media{position:relative;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;aspect-ratio:1/1;max-width:100%;overflow:hidden;background:radial-gradient(95% 85% at 50% 40%,color-mix(in srgb,var(--glow) 72%,transparent),color-mix(in srgb,var(--glow) 14%,var(--panel)) 100%)}
.media img{display:block;width:100%;height:100%;object-fit:contain}
.badge{position:absolute;inset-inline-start:8px;bottom:8px;padding:4px 10px;border-radius:999px;background:rgba(17,20,26,.84);color:var(--text);font:600 12px var(--font-body)}
.inorder{position:absolute;inset-inline-end:8px;top:8px;padding:4px 10px;border-radius:999px;background:var(--gold-fill);color:var(--gold-ink);font:700 12px var(--font-body)}
.soldtag{position:absolute;inset-inline-start:8px;top:8px;padding:4px 10px;border-radius:999px;background:rgba(17,20,26,.9);border:1px solid var(--line);color:var(--danger);font:700 12px var(--font-body)}
.card.off .media img{filter:grayscale(1) opacity(.5)}
.card.off .name,.card.off .price{opacity:.6}
.info{display:flex;flex:1;flex-direction:column;gap:3px;padding:11px 12px 13px}
.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:2.4em;font:700 15px/1.2 var(--font-body);letter-spacing:-.005em}
.line{color:var(--muted);font-size:13px}
.hit{color:var(--gold);font-size:12.5px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font:700 18px/1 var(--font-body);color:var(--gold);font-variant-numeric:tabular-nums}
.ask{color:var(--muted);font-size:13px}
.empty{margin:36px 0;padding:28px 20px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.empty strong{display:block;margin-bottom:4px;color:var(--text);font:400 20px var(--font-display)}

.site-foot{border-top:1px solid var(--line);padding-block:30px 150px;color:var(--muted);font-size:14px;background:linear-gradient(180deg,var(--ink),#0d1015)}
.site-foot .wrap{display:grid;gap:12px;justify-items:start}
.site-foot .logo{width:132px;height:132px;border-radius:18px;background:var(--logo) center/cover no-repeat;border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line))}
.site-foot p{margin:0;max-width:60ch}
.site-foot .num{color:var(--text);font-weight:700;user-select:all}
.chat{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--wa);color:var(--wa-ink);font:700 14px var(--font-body);text-decoration:none}
.chat svg{width:20px;height:20px}

/* ---------- order bar + toast */
.orderbar{position:fixed;left:50%;translate:-50% 0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:14px;height:56px;max-width:calc(100vw - 32px);padding-block:0;padding-inline:22px 8px;border:0;border-radius:999px;background:var(--gold-fill);color:var(--gold-ink);font:700 15px var(--font-body);box-shadow:0 12px 32px rgba(0,0,0,.55)}
.orderbar .tot{display:grid;place-items:center;height:40px;padding:0 16px;border-radius:999px;background:var(--gold-ink);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100vw - 32px);padding:11px 18px;border-radius:18px;background:var(--text);color:var(--ink);font:600 14px var(--font-body);box-shadow:0 10px 28px rgba(0,0,0,.45);text-align:center}
.toast.bad{background:#ffd9d9;color:#4a0f0f}


/* ---------- dialogs */
dialog{padding:0;border:0;color:var(--text);background:var(--panel);max-width:none;max-height:none;overflow:hidden}
dialog::backdrop{background:rgba(7,9,13,.78)}
.sheet{--gs:max(18px,env(safe-area-inset-left,0px));--ge:max(18px,env(safe-area-inset-right,0px));position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0}
html[dir=rtl] .sheet{--gs:max(18px,env(safe-area-inset-right,0px));--ge:max(18px,env(safe-area-inset-left,0px))}
.sheet[open]{display:flex;flex-direction:column}
.x{position:absolute;top:12px;inset-inline-end:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(17,20,26,.85);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.s-media{position:relative;flex:none;overflow:hidden;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;height:clamp(170px,30vh,280px);height:clamp(170px,30dvh,280px);background:radial-gradient(90% 85% at 50% 40%,color-mix(in srgb,var(--glow) 75%,transparent),color-mix(in srgb,var(--glow) 16%,var(--panel)) 100%)}
.s-media img{display:block;width:100%;height:100%;object-fit:contain;padding:10px}
.s-media.off img{filter:grayscale(1) opacity(.55)}
.s-main{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;min-width:0}
.s-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-block:18px 14px;padding-inline:var(--gs) var(--ge)}
.s-foot{flex:none;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));padding-inline:var(--gs) var(--ge);border-top:1px solid var(--line);background:var(--panel)}
h2{margin:0;font:400 26px/1.15 var(--font-display);letter-spacing:.01em;text-wrap:balance;padding-inline-end:40px}
html[dir=rtl] h2{font-weight:800;letter-spacing:0;font-size:23px}
.s-sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.chips li{padding:5px 12px;border-radius:999px;background:var(--panel-2);font-size:13px}
.s-price{margin-top:14px;font:700 28px/1 var(--font-body);color:var(--gold);font-variant-numeric:tabular-nums}
.s-price small{margin-inline-start:6px;color:var(--muted);font:500 14px var(--font-body)}
.s-price.ask{font:500 14px var(--font-body);color:var(--muted)}
.note{margin:14px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.note.off{border-color:color-mix(in srgb,var(--danger) 55%,var(--line));color:var(--danger)}
h3{margin:20px 0 10px;font:700 15px var(--font-body);display:flex;justify-content:space-between;align-items:baseline}
h3 span{color:var(--muted);font:400 13px var(--font-body)}
.opts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px;padding-inline:14px 6px;border-radius:12px;border:1px solid transparent;background:var(--panel-2);min-height:52px}
.opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 11%,var(--panel-2))}
.opt.gone{opacity:.55}
.opt .t{min-width:0;font-weight:500;overflow-wrap:anywhere}
.opt .gt{flex:none;padding-inline-end:8px;color:var(--danger);font-size:13px;font-weight:600}
.step{display:flex;flex:none;align-items:center;direction:ltr}
.step button{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:600 20px/1 var(--font-body)}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--gold-fill);color:var(--gold-ink);font:700 16px var(--font-body);text-decoration:none}
.cta[disabled],.cta[aria-disabled="true"]{background:var(--panel-2);color:var(--muted);cursor:not-allowed}
.cta.wa{justify-content:center;background:var(--wa);color:var(--wa-ink)}
.cta.wa[aria-disabled="true"]{background:var(--panel-2);color:var(--muted)}
.cta.wa svg{width:22px;height:22px}
.cta span:last-child{font-variant-numeric:tabular-nums}
.linkbtn{justify-self:center;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 8px}
.editlink{margin-top:16px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:600 14px var(--font-body)}

@media (min-width:860px){
  .sheet.product{inset:0;margin:auto;width:min(940px,calc(100vw - 48px));height:min(640px,calc(100dvh - 48px));max-height:none;border-radius:22px}
  .sheet.product[open]{flex-direction:row}
  .sheet.product .s-media{width:48%;height:auto;align-self:stretch}
  .sheet.product .s-main{width:52%}
  .sheet.drawer{inset-block:0;inset-inline:auto 0;width:min(460px,100vw);height:100dvh;max-height:none;border-radius:0}
}

/* cart */
.c-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding-block:16px 12px;padding-inline:var(--gs) var(--ge);border-bottom:1px solid var(--line)}
.c-head h2{padding:0}
.c-head .x{position:static;background:var(--panel-2)}
.c-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-block:14px 18px;padding-inline:var(--gs) var(--ge)}
.c-foot{flex:none;display:grid;gap:10px;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));padding-inline:var(--gs) var(--ge);border-top:1px solid var(--line);background:var(--panel)}
.cl{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding-block:12px;border-bottom:1px solid var(--line)}
.cl:first-child{padding-top:0}
.cl .th{width:56px;height:56px;border-radius:12px;overflow:hidden;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 70%,transparent),color-mix(in srgb,var(--glow) 15%,var(--panel)))}
.cl .th img{width:100%;height:100%;object-fit:contain;display:block}
.cl .cn{font:700 15px/1.2 var(--font-body)}
.cl .cp{color:var(--muted);font-size:13px}
.cl .rm{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.cl .rm svg{width:18px;height:18px}
.cl .rows{grid-column:1/-1;display:grid;gap:6px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px;padding-inline:12px 4px;border-radius:12px;background:var(--panel-2)}
.crow .t{min-width:0;font-size:14px;overflow-wrap:anywhere}
.crow .sub{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.crow .step button{width:36px;height:36px}
.c-empty{padding:40px 12px;text-align:center;color:var(--muted)}
.c-empty strong{display:block;margin-bottom:6px;color:var(--text);font:400 20px var(--font-display)}
.c-empty button{margin-top:16px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:700}
form{display:grid;gap:12px;margin-top:20px}
form label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
form label b{color:var(--text);font-weight:600;font-size:14px}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:15px}
textarea{min-height:72px;resize:vertical}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none}
.err{margin:0;color:var(--danger);font-size:13px}
details.preview{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.preview summary{height:44px;display:flex;align-items:center;cursor:pointer;color:var(--muted);font-size:14px}
details.preview textarea{min-height:190px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:none}
details.preview .copy{margin:10px 0 14px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:14px}
.totals{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.totals .lbl{color:var(--muted);font-size:14px}
.totals .sum{font:700 24px/1 var(--font-body);color:var(--gold);font-variant-numeric:tabular-nums}
.totals .sum.txt{font:600 16px/1.2 var(--font-body);color:var(--muted)}
.pending{margin:-4px 0 0;color:var(--muted);font-size:13px}
.fine{margin:0;color:var(--muted);font-size:12.5px;text-align:center}
.fine b{color:var(--text);font-weight:700;user-select:all}

/* age gate */
dialog.gate{position:fixed;inset:0;margin:auto;width:min(420px,calc(100vw - 32px));height:fit-content;max-height:calc(100dvh - 24px);overflow-y:auto;border-radius:24px;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));padding:22px 24px 24px;text-align:center;background:linear-gradient(180deg,#1d232d,var(--panel) 55%)}
dialog.gate::backdrop{background:rgba(7,9,13,.84);backdrop-filter:blur(12px)}
.gate .logo{width:min(230px,56vw);aspect-ratio:1;margin:0 auto;border-radius:22px;background:var(--logo) center/cover no-repeat;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
.gate h2{padding:0;margin-top:2px;font-size:24px}
.gate p{margin:8px 0 20px;color:var(--muted)}
.gate .btns{display:grid;gap:10px}
.gate .no{height:46px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600}
.gate .cta{justify-content:center}
.gate .lg{margin:16px auto 0;display:block;border:0;background:none;color:var(--muted);font:600 13px var(--font-body);text-decoration:underline}

@media (prefers-reduced-motion:no-preference){
  .sheet[open]{animation:rise .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{transform:translateY(28px);opacity:0}}
  @media (min-width:860px){.sheet.drawer[open]{animation:slide .3s cubic-bezier(.2,.8,.2,1)}@keyframes slide{from{transform:translateX(40px);opacity:0}}html[dir=rtl] .sheet.drawer[open]{animation-name:slideR}@keyframes slideR{from{transform:translateX(-40px);opacity:0}}}
  .toast{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:0}}
}

.wahelp{display:grid;gap:10px;padding:12px;border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:14px;background:var(--panel-2)}
.wahelp p{margin:0;font-size:13.5px;line-height:1.5;color:var(--text)}
.wahelp .wrow{display:flex;gap:8px;flex-wrap:wrap}
.wahelp .btn{text-decoration:none}

.wahelp .wnum{font:700 17px var(--font-body);letter-spacing:.01em;user-select:all}
.wahelp a.btn{color:var(--text)}
.c-foot.help .fine{display:none}


/* ---------- admin panel (only built for people who can edit the artifact) */
.sheet.adminp{inset:0;margin:0;width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0}
@media (min-width:860px){.sheet.adminp{inset:0;margin:auto;width:min(980px,calc(100vw - 48px));height:min(820px,calc(100dvh - 48px));border-radius:22px}}
.a-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px;padding-inline:var(--gs) var(--ge)}
.a-head h2{padding:0;font-size:22px}
.a-head small{display:block;color:var(--muted);font:400 13px var(--font-body);margin-top:2px}
.a-head .x{position:static;background:var(--panel-2)}
.a-bar{flex:none;display:grid;gap:10px;padding-block:0 12px;padding-inline:var(--gs) var(--ge);border-bottom:1px solid var(--line)}
.a-bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a-bar input[type=search]{flex:1 1 180px;min-width:0;height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2)}
.a-bar input[type=search]:focus{border-color:var(--gold);outline:none}
.btn{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font:600 14px var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{border:0;background:var(--gold-fill);color:var(--gold-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.danger{border-color:color-mix(in srgb,var(--danger) 50%,var(--line));color:var(--danger)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.a-list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-block:8px;padding-inline:var(--gs) var(--ge);display:grid;align-content:start;gap:8px}
.a-banner{margin:10px 0 0;padding:12px 14px;border:1px solid var(--gold);border-radius:12px;background:color-mix(in srgb,var(--gold) 10%,var(--panel));font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.a-item{border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.a-item.dirty{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.a-item.open{background:#1c222c}
.a-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px}
.a-th{width:48px;height:48px;border-radius:10px;overflow:hidden;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);background:radial-gradient(circle,color-mix(in srgb,var(--glow) 70%,transparent),color-mix(in srgb,var(--glow) 15%,var(--panel)))}
.a-th img{width:100%;height:100%;object-fit:contain;display:block}
.a-main{all:unset;box-sizing:border-box;display:grid;gap:2px;min-width:0;cursor:pointer;padding-block:2px}
.a-main:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.a-main b{font:700 15px/1.25 var(--font-body);overflow-wrap:anywhere}
.a-main span{color:var(--muted);font-size:13px}
.a-main .bad{color:var(--danger)}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px;font:600 13px var(--font-body);color:var(--muted)}
.sw i{position:relative;flex:none;width:46px;height:28px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"] i{background:color-mix(in srgb,var(--ok) 30%,var(--panel-2));border-color:var(--ok)}
.sw[aria-checked="true"] i::after{background:var(--ok);transform:translateX(18px)}
html[dir=rtl] .sw[aria-checked="true"] i::after{transform:translateX(-18px)}
.sw[aria-checked="true"]{color:var(--ok)}
.a-ed{display:grid;gap:14px;padding:4px 14px 16px;border-top:1px solid var(--line)}
.a-ed .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.a-ed label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.a-ed label>b{color:var(--text);font-weight:600;font-size:13.5px}
.a-ed input[type=text],.a-ed input[type=number],.a-ed textarea,.a-ed select{padding:10px 12px;font-size:14.5px}
.a-ed textarea{min-height:56px}
.a-photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.a-photo .pv{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);background:radial-gradient(circle,color-mix(in srgb,var(--glow) 70%,transparent),color-mix(in srgb,var(--glow) 15%,var(--panel)))}
.a-photo .pv img{width:100%;height:100%;object-fit:contain;display:block}
.a-photo .pv.busy::after{content:attr(data-busy);position:absolute;inset:0;display:grid;place-items:center;background:rgba(17,20,26,.75);font-size:12px;text-align:center;padding:6px}
.a-photo p{margin:6px 0 0;color:var(--muted);font-size:12.5px;max-width:34ch}
.a-opts h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font:700 14px var(--font-body)}
.a-opts h4 span{color:var(--muted);font:400 13px var(--font-body)}
.a-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.a-opt input[type=text]{padding:8px 12px}
.a-opt .sw{padding:0}
.a-opt .sw i{width:40px;height:24px}
.a-opt .sw i::after{width:18px;height:18px}
.a-opt .sw[aria-checked="true"] i::after{transform:translateX(16px)}
html[dir=rtl] .a-opt .sw[aria-checked="true"] i::after{transform:translateX(-16px)}
.a-opt .del{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.a-opt .del svg{width:17px;height:17px}
.a-opt.gone input[type=text]{color:var(--muted);text-decoration:line-through}
.a-addopts{display:grid;gap:8px;margin-top:8px}
.a-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-inline:var(--gs) var(--ge);border-top:1px solid var(--line);background:var(--panel)}
.a-foot .st{color:var(--muted);font-size:14px;min-width:0}
.a-foot .st.bad{color:var(--danger)}
.a-foot .acts{display:flex;gap:8px;margin-inline-start:auto}
.a-foot .btn{height:46px}

/* options block sits first in the editor so stock switches are the first thing an editor sees */
.a-opts{padding:12px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel-2) 55%,transparent)}
.a-opts h4 .cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-inline-start:6px;padding:0 6px;border-radius:11px;background:var(--panel-2);color:var(--muted);font:600 12px var(--font-body)}
.a-kind{margin-bottom:10px}
.a-opt .mid{display:grid;gap:3px;min-width:0}

function t(k){ var v = T[lang][k]; if (v === undefined) v = T.en[k]; return typeof v === 'function' ? v.apply(null, [].slice.call(arguments, 1)) : v; }
function pl(k, n){
  var f = PL[k][lang];
  if (lang === 'ar') return n === 1 ? f[0] : n === 2 ? f[1] : n + ' ' + (n >= 3 && n <= 10 ? f[2] : f[3]);
  return n + ' ' + (n === 1 ? f[0] : f[1]);
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ltr(s){ return '⁦' + s + '⁩'; }
function money(n){ return SHOP.cur + (n % 1 ? n.toFixed(2) : n); }
function moneyH(n){ return '<bdi class="n">' + money(n) + '</bdi>'; }
function nm(p){ return lang === 'ar' && p.nameAr ? p.nameAr : p.name; }
function noteOf(p){ return (lang === 'ar' && p.noteAr) || p.note || ''; }
function catOf(id){ return CATS.filter(function(c){ return c.id === id; })[0]; }
function subOf(cat, id){ return (cat.subs || []).filter(function(s){ return s.id === id; })[0]; }
function cl(o){ return lang === 'ar' ? o.ar : o.en; }
function kindOf(p){ return p.kind === 'color' ? 'color' : p.kind === 'combo' ? 'combo' : 'flavor'; }
function isOn(p){ return p.avail !== false; }
function optOn(p, o){ return !(p.off && p.off.indexOf(o) > -1); }
function liveOpts(p){ return p.options.filter(function(o){ return optOn(p, o); }); }
function lineOf(p){ return p.specs.slice(0, 2).map(trSpec).join(lang === 'ar' ? '، ' : ', '); }

var byId = {};
function indexProducts(){
  byId = {};
  PRODUCTS.forEach(function(p){
    byId[p.id] = p;
    var c = catOf(p.cat) || { en: '', ar: '' };
    p._hay = fold([p.name, p.nameAr || '', p.sub || '', c.en, c.ar, c.alt || '', p.specs.join(' '), (isOn(p) ? liveOpts(p) : p.options).join(' ')].join(' '));
  });
}
indexProducts();
function tokens(q){ return q.split(/\s+/).filter(Boolean).map(tokNorm); }
function hit(str, tk){ var s = fold(str); return s.indexOf(tk) > -1 || (ALIAS[tk] && s.indexOf(ALIAS[tk]) > -1); }

/* ---------- state + cart */
var state = { cat: 'all', sub: 'all', q: '' };
var cart = [];   /* [{id, opt, qty}] opt is '' for products without options */
var dropped = false;
(function loadCart(){
  try {
    var raw = JSON.parse(store.get('kv-cart-v1') || '[]');
    raw.forEach(function(l){
      var p = byId[l.id];
      if (!p || !(l.qty > 0)) return;
      if (p.options.length ? p.options.indexOf(l.opt) < 0 : l.opt !== '') return;
      if (!isOn(p) || (l.opt && !optOn(p, l.opt))) { dropped = true; return; }
      cart.push({ id: l.id, opt: l.opt, qty: Math.min(99, l.qty | 0) });
    });
  } catch (e) {}
})();
function saveCart(){ store.set('kv-cart-v1', JSON.stringify(cart)); }
function qtyOf(id, opt){ for (var i = 0; i < cart.length; i++) if (cart[i].id === id && cart[i].opt === opt) return cart[i].qty; return 0; }
function qtyOfProduct(id){ return cart.reduce(function(n, l){ return n + (l.id === id ? l.qty : 0); }, 0); }
function setQty(id, opt, qty){
  for (var i = 0; i < cart.length; i++) {
    if (cart[i].id === id && cart[i].opt === opt) { if (qty > 0) cart[i].qty = qty; else cart.splice(i, 1); return; }
  }
  if (qty > 0) cart.push({ id: id, opt: opt, qty: qty });
}
function totals(){
  var items = 0, priced = 0, unpriced = 0;
  cart.forEach(function(l){
    var p = byId[l.id]; items += l.qty;
    if (p.price == null) unpriced += l.qty; else priced += p.price * l.qty;
  });
  return { items: items, priced: priced, unpriced: unpriced };
}

/* ---------- catalogue */
function visible(){
  var toks = tokens(state.q);
  var out = PRODUCTS.filter(function(p){
    if (toks.length) return toks.every(function(k){ return p._hay.indexOf(k) > -1 || (ALIAS[k] && p._hay.indexOf(ALIAS[k]) > -1); });
    return (state.cat === 'all' || p.cat === state.cat) && (state.sub === 'all' || p.sub === state.sub);
  });
  return out.filter(isOn).concat(out.filter(function(p){ return !isOn(p); }));   /* sold-out products go last */
}
function renderTabs(){
  var counts = { all: PRODUCTS.length };
  PRODUCTS.forEach(function(p){ counts[p.cat] = (counts[p.cat] || 0) + 1; });
  var on = state.q ? null : state.cat;   /* while searching, no tab is selected: results span every category */
  var html = '<button class="tab" type="button" data-cat="all" aria-pressed="' + (on === 'all') + '">' + t('all') + ' <span class="ct">' + counts.all + '</span></button>';
  CATS.forEach(function(c){
    html += '<button class="tab" type="button" data-cat="' + c.id + '" aria-pressed="' + (on === c.id) + '">' + cl(c) +
      (lang === 'en' && c.alt ? ' <span class="ar" lang="ar">' + c.alt + '</span>' : '') + ' <span class="ct">' + (counts[c.id] || 0) + '</span></button>';
  });
  $('#tabs').innerHTML = html;
  var cat = catOf(state.cat), subs = $('#subs');
  if (cat && cat.subs.length && !state.q) {
    var sc = {}; PRODUCTS.forEach(function(p){ if (p.cat === cat.id) sc[p.sub] = (sc[p.sub] || 0) + 1; });
    var h = '<button class="chip" type="button" data-sub="all" aria-pressed="' + (state.sub === 'all') + '">' + esc(t('allOf', cl(cat))) + '</button>';
    cat.subs.forEach(function(s){ h += '<button class="chip" type="button" data-sub="' + esc(s.id) + '" aria-pressed="' + (state.sub === s.id) + '">' + esc(cl(s)) + ' (' + (sc[s.id] || 0) + ')</button>'; });
    subs.innerHTML = h; subs.hidden = false;
  } else { subs.hidden = true; subs.innerHTML = ''; }
}
function renderGrid(){
  var list = visible(), toks = tokens(state.q), cat = catOf(state.cat);
  var sub = cat && state.sub !== 'all' ? subOf(cat, state.sub) : null;
  $('#title').textContent = state.q ? t('resultsFor', state.q.trim()) : state.cat === 'all' ? t('allProducts') : sub ? cl(sub) : cl(cat);
  $('#count').textContent = pl('product', list.length);
  $('#intro').hidden = !(state.cat === 'all' && !state.q);
  $('#none').hidden = list.length > 0;
  $('#grid').innerHTML = list.map(function(p){
    var live = liveOpts(p), n = live.length, off = !isOn(p);
    var badge = n && !off ? '<span class="badge">' + pl(kindOf(p), n) + '</span>' : '';
    var inq = qtyOfProduct(p.id), hitTxt = '';
    if (toks.length && n && !off) {
      var hits = live.filter(function(o){ return toks.every(function(k){ return hit(o, k); }); });
      if (hits.length && hits.length < n) hitTxt = '<span class="hit">' + esc(hits.slice(0, 2).join(', ')) + (hits.length > 2 ? ' +' + (hits.length - 2) : '') + '</span>';
    }
    return '<li><button class="card' + (off ? ' off' : '') + '" type="button" data-id="' + esc(p.id) + '" style="--glow:rgb(' + p.glow.join(',') + ')">' +
      '<span class="media"><img src="' + esc(p.img) + '" alt="' + esc(nm(p)) + '" loading="lazy" decoding="async">' + badge +
      (off ? '<span class="soldtag">' + t('soldOut') + '</span>' : '') + (inq ? '<span class="inorder">' + t('inOrder', inq) + '</span>' : '') + '</span>' +
      '<span class="info"><span class="name">' + esc(nm(p)) + '</span><span class="line">' + esc(lineOf(p)) + '</span>' + hitTxt +
      '<span class="foot">' + (p.price != null ? '<span class="price">' + moneyH(p.price) + '</span>' : '<span class="ask">' + t('askPrice') + '</span>') + '</span></span></button></li>';
  }).join('');
}
function totalText(tt){ return tt.priced > 0 ? ltr(money(tt.priced) + (tt.unpriced ? ' +' : '')) : (tt.items ? t('askPrice') : ''); }
function renderBars(){
  var tt = totals();
  var n = $('#cartn'); n.textContent = tt.items; n.hidden = !tt.items;
  var ob = $('#orderbar'); ob.hidden = !tt.items;
  $('#ob-text').textContent = t('viewOrder', pl('item', tt.items));
  $('#ob-tot').textContent = totalText(tt);
}
function render(){ renderTabs(); renderGrid(); renderBars(); }

/* ---------- live catalogue: the page ships with a built-in list, then the server's newest list replaces it */
var lastCatalog = 0;
function normProduct(p){
  if (!p || typeof p.id !== 'string' || typeof p.name !== 'string' || !catOf(p.cat)) return null;
  var q = {}, k;
  for (k in p) if (Object.prototype.hasOwnProperty.call(p, k)) q[k] = p[k];
  q.options = Array.isArray(p.options) ? p.options.filter(function(o){ return typeof o === 'string'; }) : [];
  q.specs = Array.isArray(p.specs) ? p.specs.filter(function(o){ return typeof o === 'string'; }) : [];
  q.off = Array.isArray(p.off) ? p.off.filter(function(o){ return q.options.indexOf(o) > -1; }) : undefined;
  if (!q.off || !q.off.length) delete q.off;
  q.glow = Array.isArray(p.glow) && p.glow.length === 3 ? p.glow : [120, 110, 90];
  q.price = typeof p.price === 'number' ? p.price : null;
  q.img = p.img || NEW_IMG;
  q.sub = p.sub || null;
  return q;
}
function pruneCart(){
  var before = cart.length;
  cart = cart.filter(function(l){
    var p = byId[l.id];
    if (!p) return false;
    if (p.options.length ? p.options.indexOf(l.opt) < 0 : l.opt !== '') return false;
    return isOn(p) && !(l.opt && !optOn(p, l.opt));
  });
  if (cart.length !== before) saveCart();
  return cart.length !== before;
}
function applyCatalog(cat, force){
  if (!cat || !Array.isArray(cat.products)) return false;
  if (!force && DATA.rev === cat.rev) return false;
  var list = cat.products.map(normProduct).filter(Boolean);
  PRODUCTS.length = 0; list.forEach(function(p){ PRODUCTS.push(p); });
  DATA.rev = cat.rev; lastCatalog = Date.now(); indexProducts();
  var lost = pruneCart();
  render();
  if ($('#cart').open) renderCart();
  if (lost) toast(t('tDropped'), true);
  return true;
}
function fetchCatalog(){
  lastCatalog = Date.now();
  return fetch('/api/catalog', { cache: 'no-cache', headers: { accept: 'application/json' } }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}

var toastTimer;
function toast(msg, bad){
  var el = $('#toast'); el.textContent = msg; el.hidden = false; el.classList.toggle('bad', !!bad);
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, bad ? 4200 : 2200);
}

/* ---------- dialogs */
/* Safari/iOS can collapse a flex scroll area inside an auto-height bottom sheet to 0px (only the photo shows).
   If that happens, give the sheet a definite height, which every engine resolves the same way. */
function fitSheet(d){
  d.style.height = '';
  var sc = d.querySelector('.s-scroll, .c-scroll, .a-list');
  if (!sc || !d.open) return;
  if (sc.clientHeight < 90 && sc.scrollHeight > sc.clientHeight + 16) d.style.height = Math.round(window.innerHeight * 0.92) + 'px';
}
function openD(d){
  if (!d.open) d.showModal();
  document.documentElement.classList.add('lock');
  if (d.classList.contains('sheet')) requestAnimationFrame(function(){ fitSheet(d); });
}
function closeD(d){ if (d.open) d.close(); }
['sheet', 'cart'].forEach(function(id){
  var d = $('#' + id);
  d.addEventListener('click', function(e){ if (e.target === d) d.close(); });
});
document.querySelectorAll('dialog').forEach(function(d){
  d.addEventListener('close', function(){ d.style.height = ''; if (!document.querySelector('dialog[open]')) document.documentElement.classList.remove('lock'); });
});


/* ---------- search, tabs, language */
$('#tabs').addEventListener('click', function(e){
  var b = e.target.closest('[data-cat]'); if (!b) return;
  state.cat = b.dataset.cat; state.sub = 'all'; state.q = ''; $('#q').value = ''; render();
});
$('#subs').addEventListener('click', function(e){
  var b = e.target.closest('[data-sub]'); if (!b) return;
  state.sub = b.dataset.sub; render();
});
$('#q').addEventListener('input', function(e){ state.q = e.target.value; renderTabs(); renderGrid(); });
$('#grid').addEventListener('click', function(e){
  var b = e.target.closest('[data-id]'); if (b) openProduct(b.dataset.id);
});
function applyLang(){
  var h = document.documentElement;
  h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(function(el){ el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-i-ph]').forEach(function(el){ el.placeholder = t(el.dataset.iPh); });
  document.querySelectorAll('[data-i-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.dataset.iAria)); });
  var other = lang === 'ar' ? 'English' : 'عربي';
  [$('#langbtn'), $('#g-lang')].forEach(function(b){ b.textContent = other; b.lang = lang === 'ar' ? 'en' : 'ar'; b.setAttribute('aria-label', t('switchTo')); });
  $('#c-clear').textContent = t('clear'); delete $('#c-clear').dataset.armed;
  render();
  if ($('#cart').open) renderCart();
  if ($('#sheet').open && cur) openProduct(cur.id, true);
  if (admin.on && $('#admin').open) adminRender();
  if ($('#auth').open) renderAuth();
  if ($('#people').open && admin.on) peopleRender();
}
function setLang(l){ lang = l; store.set('kv-lang', l); applyLang(); }
function toggleLang(){ setLang(lang === 'ar' ? 'en' : 'ar'); }
$('#langbtn').addEventListener('click', toggleLang);
$('#g-lang').addEventListener('click', toggleLang);

/* ---------- product sheet */
var cur = null, draft = [];
function labelFor(p){ return t(p.kind === 'color' ? 'chooseColor' : p.kind === 'combo' ? 'chooseCombo' : 'chooseFlavor'); }
function stepHtml(i, q){
  return '<div class="step"><button type="button" data-i="' + i + '" data-d="-1" aria-label="' + t('remove1') + '"' + (q ? '' : ' disabled') + '>−</button>' +
    '<output>' + q + '</output><button type="button" data-i="' + i + '" data-d="1" aria-label="' + t('add1') + '">+</button></div>';
}
function openProduct(id, relang){
  var p = byId[id]; cur = p;
  var off = !isOn(p), keys = p.options.length ? p.options : [''];
  if (!relang) draft = keys.map(function(o){ return off || (o && !optOn(p, o)) ? 0 : qtyOf(p.id, o); });
  var g = 'rgb(' + p.glow.join(',') + ')';
  $('#sheet').style.setProperty('--glow', g); $('#s-media').style.setProperty('--glow', g);
  $('#s-media').classList.toggle('off', off);
  var img = $('#s-img'); img.src = p.img; img.alt = nm(p);
  $('#s-name').textContent = nm(p);
  var cat = catOf(p.cat), sub = p.sub && subOf(cat, p.sub);
  $('#s-sub').textContent = sub ? cl(sub) : cl(cat);
  $('#s-specs').innerHTML = p.specs.map(function(s){ return '<li>' + esc(trSpec(s)) + '</li>'; }).join('');
  var pr = $('#s-price');
  if (p.price != null) { pr.className = 's-price'; pr.innerHTML = moneyH(p.price) + '<small>' + t('each') + '</small>'; }
  else { pr.className = 's-price ask'; pr.textContent = t('priceOnWa'); }
  $('#s-off').hidden = !off;
  var note = $('#s-note'), nt = noteOf(p); note.hidden = !nt; note.textContent = nt;
  $('#s-label').textContent = p.options.length ? labelFor(p) : t('qty');
  $('#s-avail').textContent = p.options.length ? t('nAvail', liveOpts(p).length) : '';
  $('#s-opts').innerHTML = (p.options.length ? p.options : [t('howMany')]).map(function(o, i){
    var gone = off || (p.options.length && !optOn(p, o));
    return '<li class="opt' + (draft[i] ? ' on' : '') + (gone ? ' gone' : '') + '" data-row="' + i + '"><span class="t">' + esc(o) + '</span>' +
      (gone ? '<span class="gt">' + t('soldOut') + '</span>' : stepHtml(i, draft[i])) + '</li>';
  }).join('');
  $('#s-edit').hidden = !admin.on;
  $('#s-opts').parentNode.scrollTop = 0;
  updateAdd();
  openD($('#sheet'));
}
function updateAdd(){
  var p = cur, q = draft.reduce(function(a, b){ return a + b; }, 0), had = qtyOfProduct(p.id);
  var b = $('#s-add'), l = $('#s-add-l'), r = $('#s-add-r');
  b.disabled = false; r.textContent = '';
  if (!isOn(p)) { l.textContent = t('notNow'); b.disabled = true; }
  else if (q > 0) { l.textContent = (had ? t('updateTo', pl('item', q)) : t('addTo', pl('item', q))); r.textContent = p.price != null ? ltr(money(p.price * q)) : ''; }
  else if (had) l.textContent = t('removeFrom');
  else { l.textContent = p.options.length ? t('pickOne') : t('pickQty'); b.disabled = true; }
}
$('#s-opts').addEventListener('click', function(e){
  var b = e.target.closest('button[data-i]'); if (!b) return;
  var i = +b.dataset.i, v = Math.max(0, Math.min(99, draft[i] + +b.dataset.d));
  draft[i] = v;
  var row = b.closest('.opt'); row.classList.toggle('on', v > 0);
  row.querySelector('output').textContent = v;
  row.querySelector('[data-d="-1"]').disabled = !v;
  updateAdd();
});
$('#s-add').addEventListener('click', function(){
  var p = cur, had = qtyOfProduct(p.id), keys = p.options.length ? p.options : [''];
  keys.forEach(function(o, i){ setQty(p.id, o, draft[i]); });
  var q = draft.reduce(function(a, b){ return a + b; }, 0);
  saveCart(); closeD($('#sheet')); render();
  toast(t(q ? (had ? 'tUpdated' : 'tAdded') : 'tRemoved'));
});
$('#s-close').addEventListener('click', function(){ closeD($('#sheet')); });

/* ---------- order sheet */
function groups(){
  var order = [], map = {};
  cart.forEach(function(l){ if (!map[l.id]) { map[l.id] = []; order.push(l.id); } map[l.id].push(l); });
  return order.map(function(id){ return { p: byId[id], lines: map[id] }; });
}
function renderCart(){
  var g = groups(), tt = totals();
  $('#c-empty').hidden = g.length > 0;
  $('#c-form').hidden = !g.length; $('#c-preview').hidden = !g.length;
  $('#c-lines').innerHTML = g.map(function(x){
    var p = x.p;
    var rows = x.lines.map(function(l){
      var sub = p.price != null ? '<span class="sub"><bdi class="n">' + l.qty + ' × ' + money(p.price) + ' = ' + money(p.price * l.qty) + '</bdi></span>' : '';
      return '<div class="crow"><span class="t">' + (l.opt ? esc(l.opt) : t('qty')) + sub + '</span>' +
        '<div class="step"><button type="button" data-id="' + esc(p.id) + '" data-o="' + esc(l.opt) + '" data-d="-1" aria-label="' + t('remove1') + '">−</button><output>' + l.qty + '</output>' +
        '<button type="button" data-id="' + esc(p.id) + '" data-o="' + esc(l.opt) + '" data-d="1" aria-label="' + t('add1') + '">+</button></div></div>';
    }).join('');
    return '<div class="cl" style="--glow:rgb(' + p.glow.join(',') + ')"><span class="th"><img src="' + esc(p.img) + '" alt=""></span>' +
      '<div><div class="cn">' + esc(nm(p)) + '</div><div class="cp">' + (p.price != null ? t('cartPrice', moneyH(p.price)) : t('cartPriceWa')) + '</div></div>' +
      '<button class="rm" type="button" data-rm="' + esc(p.id) + '" aria-label="' + esc(t('removeP', nm(p))) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>' +
      '<div class="rows">' + rows + '</div></div>';
  }).join('');
  $('#t-lbl').textContent = pl('item', tt.items);
  $('#t-sum').textContent = tt.priced > 0 ? ltr(money(tt.priced)) : (tt.items ? t('toConfirm') : '');
  $('#t-sum').className = 'sum' + (tt.priced > 0 ? '' : ' txt');
  var pend = $('#t-pending');
  pend.hidden = !(tt.priced > 0 && tt.unpriced > 0);
  pend.textContent = tt.unpriced ? t('pendingWa', pl('item', tt.unpriced)) : '';
  updateLink();
}
function message(){
  var name = $('#f-name').value.trim(), addr = $('#f-addr').value.trim(), notes = $('#f-notes').value.trim();
  var tt = totals(), out = [];
  out.push(t('mHead'), '');
  out.push('*' + t('mName') + ':* ' + (name || '-'));
  if (addr) out.push('*' + t('mAddr') + ':* ' + addr);
  out.push('', '*' + t('mOrder') + '*');
  groups().forEach(function(x, i){
    var p = x.p;
    if (!p.options.length) {
      var l0 = x.lines[0];
      out.push((i + 1) + ') *' + p.name + '* x' + l0.qty + (p.price != null ? ' = ' + money(p.price * l0.qty) : ''));
    } else {
      out.push((i + 1) + ') *' + p.name + '*');
      x.lines.forEach(function(l){ out.push('   - ' + l.opt + ' x' + l.qty + (p.price != null ? ' = ' + money(p.price * l.qty) : '')); });
    }
  });
  out.push('');
  if (tt.priced > 0) out.push('*' + t('mTotal') + ':* ' + ltr(money(tt.priced)) + (tt.unpriced ? t('mPlus', pl('item', tt.unpriced)) : ''));
  else out.push('*' + t('mTotal') + ':* ' + t('mTbc'));
  if (notes) out.push('', '*' + t('mNotes') + ':* ' + notes);
  return out.join('\n');
}
function updateLink(){
  var a = $('#wa'), empty = !cart.length;
  var msg = empty ? '' : message();
  $('#c-msg').value = msg;
  a.href = empty ? '#' : 'https://wa.me/' + SHOP.phone + '?text=' + encodeURIComponent(msg);
  a.setAttribute('aria-disabled', empty ? 'true' : 'false');
}
$('#c-lines').addEventListener('click', function(e){
  var rm = e.target.closest('[data-rm]');
  if (rm) { var id = rm.dataset.rm; cart = cart.filter(function(l){ return l.id !== id; }); }
  else {
    var b = e.target.closest('button[data-d]'); if (!b) return;

function hsv(r, g, b){
  r /= 255; g /= 255; b /= 255;

  var d = x.getImageData(0, 0, c.width, c.height).data, buckets = {}, all = [0, 0, 0, 0], i;
  for (i = 0; i < d.length; i += 4) {
    if (d[i + 3] <= 200) continue;
    all[0] += d[i]; all[1] += d[i + 1]; all[2] += d[i + 2]; all[3]++;
    var q = hsv(d[i], d[i + 1], d[i + 2]);
    if (q[1] < 0.35 || q[2] < 0.35) continue;
    var key = Math.floor(q[0] * 18), w = q[1] * q[2], a = buckets[key] || (buckets[key] = [0, 0, 0, 0]);

  }
  var best = null; Object.keys(buckets).forEach(function(k){ if (!best || buckets[k][3] > best[3]) best = buckets[k]; });
  if (best) return [0, 1, 2].map(function(j){ return Math.round(best[j] / best[3]); });
  if (all[3]) return [0, 1, 2].map(function(j){ return Math.round(all[j] / all[3]); });

}

  if (off.length) c.off = off;

  ['nameAr', 'note', 'noteAr'].forEach(function(k){ if (p[k] && String(p[k]).trim()) c[k] = String(p[k]).trim(); });
  return c;
}


/* ---------- the website's own admin: sign in, load the newest list, save through the server, manage admins */
var API = {
  call: function(method, url, body, raw){
    var opt = { method: method, credentials: 'same-origin', headers: { 'X-KV': '1' } };
    if (body !== undefined) {
      if (raw) { opt.body = body; opt.headers['Content-Type'] = body.type || 'application/octet-stream'; }
      else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
    }
    return fetch(url, opt).then(function(r){
      return r.json().then(function(d){ return d; }, function(){ return {}; }).then(function(d){
        if (r.ok) return d;
        var e = new Error(d.error || ('http_' + r.status));
        e.status = r.status; e.code = d.error || ('http_' + r.status); e.data = d;
        throw e;
      });
    }, function(){ var e = new Error('network'); e.code = 'network'; throw e; });
  }
};

function errText(e){
  var c = e && e.code, d = (e && e.data) || {};
  if (c === 'network') return t('eNet');
  if (c === 'bad_login') return t('eBadLogin');
  if (c === 'locked') return t('eLocked', d.retry || 60);
  if (c === 'weak_password') return t('eWeak');
  if (c === 'bad_username') return t('eUsername');
  if (c === 'name_taken') return t('eTaken');
  if (c === 'too_many_admins') return t('eTooMany');
  if (c === 'owner_only') return t('eOwnerOnly');
  if (c === 'cannot_remove_self') return t('eSelf');
  if (c === 'no_such_admin') return t('eNoAdmin');
  if (c === 'signed_out') return t('eSignedOut');
  if (c === 'bad_code') return t('eBadCode');
  if (c === 'setup_disabled') return t('eSetupOff');
  if (c === 'already_setup') return t('eAlready');
  if (c === 'missing') return t('eMissing');
  if (c === 'busy') return t('eBusy');
  if (c === 'too_large') return t('aErrLarge');
  if (c === 'bad_product') { var bp = d.id && work && wid(d.id); return t('eBadProduct', bp && bp.name); }
  return t('eGeneric');
}

/* ---- who is signed in */
function setMe(m){
  admin.me = m; admin.on = !!m; admin.upload = m ? uploadPhoto : null;
  $('#adminbtn').hidden = !m;
  $('#s-edit').hidden = !m;
  if (m) store.set('kv-staff', '1'); else store.del('kv-staff');
}
function onSignedOut(){ setMe(null); }
function uploadPhoto(blob){
  return API.call('POST', '/api/admin?a=photo', blob, true).then(function(d){ return d.url; }, function(e){ if (e.status === 401) onSignedOut(); throw e; });
}

/* ---- sign-in / first-time setup dialog */
var authMode = 'login', authThen = null, authBusy = false;
function authMsg(text){ var m = $('#au-msg'); m.hidden = !text; m.textContent = text || ''; }
function showLabel(b){ var inp = document.getElementById(b.dataset.show); b.textContent = t(inp && inp.type === 'text' ? 'auHide' : 'auShow'); }
function renderAuth(){
  var setup = authMode === 'setup';
  $('#au-title').textContent = t(setup ? 'suTitle' : 'auTitle');
  $('#au-sub').textContent = t(setup ? 'suSub' : 'auSub');
  document.querySelectorAll('#au-form .f-setup').forEach(function(el){ el.hidden = !setup; });
  $('#au-user-l').textContent = t(setup ? 'suUser' : 'auUser');
  $('#au-pass-l').textContent = t(setup ? 'suPass' : 'auPass');
  $('#au-pass').autocomplete = setup ? 'new-password' : 'current-password';
  $('#au-go span').textContent = t(authBusy ? 'auWait' : setup ? 'suGo' : 'auGo');
  $('#au-forgot').textContent = t('auForgot'); $('#au-forgot').hidden = setup;
  document.querySelectorAll('#auth [data-show]').forEach(showLabel);
}
function openAuth(then){
  authThen = then || null; authMode = 'login'; authBusy = false;
  ['au-code', 'au-name', 'au-user', 'au-pass', 'au-pass2'].forEach(function(id){ document.getElementById(id).value = ''; });
  ['au-pass', 'au-pass2'].forEach(function(id){ document.getElementById(id).type = 'password'; });
  $('#au-go').disabled = false; authMsg(''); renderAuth(); openD($('#auth'));
  API.call('GET', '/api/auth').then(function(s){
    if (s.me) { setMe(s.me); closeD($('#auth')); var f = authThen; authThen = null; if (f) f(); return; }
    var want = s.setup ? 'setup' : 'login';
    if (want !== authMode) { authMode = want; renderAuth(); }
    var first = $(want === 'setup' ? '#au-code' : '#au-user'); if (first && $('#auth').open) first.focus();
  }, function(e){ authMsg(errText(e)); });
}
$('#au-form').addEventListener('submit', function(e){
  e.preventDefault();
  if (authBusy) return;
  var user = $('#au-user').value.trim(), pass = $('#au-pass').value, body;
  authMsg('');
  if (!user || !pass) { authMsg(t('eMissing')); return; }
  if (authMode === 'setup') {
    if (pass !== $('#au-pass2').value) { authMsg(t('suMismatch')); return; }
    body = { a: 'setup', code: $('#au-code').value, name: $('#au-name').value, username: user, password: pass };
  } else body = { a: 'login', username: user, password: pass };
  authBusy = true; $('#au-go').disabled = true; renderAuth();
  API.call('POST', '/api/auth', body).then(function(d){
    authBusy = false; $('#au-go').disabled = false;
    $('#au-pass').value = ''; $('#au-pass2').value = '';
    setMe(d.me); closeD($('#auth'));
    var f = authThen; authThen = null; if (f) f();
  }, function(err){
    authBusy = false; $('#au-go').disabled = false;
    if (err.code === 'already_setup') authMode = 'login';
    renderAuth(); authMsg(errText(err));
    if (err.code === 'bad_login') { $('#au-pass').value = ''; $('#au-pass').focus(); }
  });
});
$('#au-close').addEventListener('click', function(){ closeD($('#auth')); });
$('#auth').addEventListener('click', function(e){ if (e.target === this) closeD(this); });
$('#auth').addEventListener('close', function(){ $('#au-pass').value = ''; $('#au-pass2').value = ''; authThen = null; });
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-show]'); if (!b) return;
  var inp = document.getElementById(b.dataset.show); if (!inp) return;
  inp.type = inp.type === 'password' ? 'text' : 'password'; showLabel(b);
});
$('#staff').addEventListener('click', function(){
  if (admin.on) openAdminPanel(); else openAuth(function(){ openAdminPanel(); });
});

/* ---- the product editor: load the newest list, save, handle two people editing at once */
function setWork(cat){
  work = cat.products.map(normProduct).filter(Boolean).map(clone);
  dirty = {}; gone = {};
}
function openAdminPanel(id){
  if (!admin.on) { openAuth(function(){ openAdminPanel(id); }); return; }
  if (work && dirtyCount()) { adminOpen(id); return; }
  API.call('GET', '/api/admin?a=catalog').then(function(cat){
    setWork(cat); notice = null; applyCatalog(cat); adminOpen(id);
  }, function(e){
    if (e.status === 401) { onSignedOut(); openAuth(function(){ openAdminPanel(id); }); return; }
    work = null; dirty = {}; gone = {}; notice = t('aLoadFail'); adminOpen(id);
  });
}
function mergeConflict(res){
  var conflicts = {}, names = [];
  res.ids.forEach(function(id){
    conflicts[id] = 1;
    var mine = wid(id), theirs = res.catalog.products.filter(function(p){ return p.id === id; })[0];
    names.push('“' + ((theirs && theirs.name) || (mine && mine.name) || id) + '”');
  });
  var srv = res.catalog.products.map(normProduct).filter(Boolean).map(clone), out = [], seen = {}, nd = {}, ng = {};
  srv.forEach(function(sp){
    seen[sp.id] = 1;
    if (dirty[sp.id] && !conflicts[sp.id]) {
      var mine = wid(sp.id);
      if (mine) out.push(mine); else ng[sp.id] = sp.u | 0;   /* my edit (or my delete) still applies: nobody else touched it */
      nd[sp.id] = true;
    } else out.push(sp);
  });
  work.forEach(function(p){ if (p.isNew && dirty[p.id] && !seen[p.id]) { out.push(p); nd[p.id] = true; } });
  work = out; dirty = nd; gone = ng;
  if (openId && !wid(openId)) openId = null;
  notice = t('aConflict', names.join(', '));
  applyCatalog(res.catalog, true);
  saving = false; adminRender(); aStatus(t('aErrConflict'), true);
}
function adminSave(){
  if (saving || !work) return;
  var bad = work.filter(function(p){ return !(p.name || '').trim(); })[0];
  if (bad) { openId = bad.id; adminList(); aStatus(t('aNeedName'), true); return; }
  var changes = [];
  Object.keys(dirty).forEach(function(id){
    var p = wid(id);
    if (p) changes.push({ id: id, base: p.isNew ? null : (p.u | 0), product: cleanProduct(p) });
    else if (gone[id] !== undefined) changes.push({ id: id, base: gone[id], product: null });
  });
  if (!changes.length) { dirty = {}; gone = {}; aFoot(); return; }
  saving = true; aStatus(t('aSaving')); $('#a-save').disabled = true; $('#a-discard').disabled = true;
  API.call('POST', '/api/admin', { a: 'save', changes: changes }).then(function(d){
    saving = false;
    setWork(d.catalog); notice = null; applyCatalog(d.catalog, true);
    adminRender(); aStatus(t('aSaved'));
  }, function(err){
    if (err.code === 'conflict') { mergeConflict(err.data); return; }
    saving = false; aFoot();
    if (err.status === 401) { onSignedOut(); aStatus(t('eSignedOut'), true); openAuth(); return; }
    aStatus(err.code === 'network' ? t('eNet') : errText(err), true);
  });
}
$('#a-save').addEventListener('click', adminSave);

function signOut(){
  function done(){
    setMe(null); work = null; dirty = {}; gone = {}; notice = null; openId = null;
    closeD($('#people')); closeD($('#admin')); closeD($('#auth')); toast(t('aOutDone'));
  }
  API.call('POST', '/api/auth', { a: 'logout' }).then(done, done);
}
$('#a-out').addEventListener('click', function(){
  var b = this;
  if (dirtyCount() && !b.dataset.armed) {
    b.dataset.armed = '1'; b.textContent = t('aOut2');
    setTimeout(function(){ if (b.isConnected) { delete b.dataset.armed; b.textContent = t('aOut'); } }, 4000);
    return;
  }
  signOut();
});
$('#a-people').addEventListener('click', function(){ openPeople(); });

/* ---- admins and my account */
var team = null, credText = '';
function genPass(){
  var A = 'abcdefghjkmnpqrstuvwxyz23456789', out = '', a = new Uint32Array(12);   /* no look-alike letters */
  window.crypto.getRandomValues(a);
  for (var i = 0; i < 12; i++) { out += A.charAt(a[i] % A.length); if (i % 4 === 3 && i < 11) out += '-'; }
  return out;
}
function copyText(text){
  return new Promise(function(res){
    function fallback(){
      try {
        var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;opacity:0'; $('#people').appendChild(ta); ta.select();
        var ok = document.execCommand('copy'); ta.remove(); res(ok);
      } catch (e) { res(false); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ res(true); }, fallback); else fallback();
  });
}
function pfield(label, id, auto, gen){
  return '<label for="' + id + '"><b>' + label + '</b><span class="pw"><input id="' + id + '" type="password" autocomplete="' + auto + '" autocapitalize="none" autocorrect="off" spellcheck="false">' +
    (gen ? '<button class="gen" type="button" data-act="gen" data-for="' + id + '">' + t('pGen') + '</button>' : '') +
    '<button class="show" type="button" data-show="' + id + '">' + t('auShow') + '</button></span></label>';
}
function teamRows(){
  if (!team) return '<li class="p-row"><span class="s-sub">' + t('pLoading') + '</span></li>';
  return team.map(function(a){
    var you = a.u === admin.me.u, owner = a.role === 'owner';
    return '<li class="p-row" data-u="' + esc(a.u) + '"><div class="pr-top"><div class="who"><b>' + esc(a.name) + '<span class="role">' + t(owner ? 'roleOwner' : 'roleAdmin') + '</span>' +
      (you ? '<span class="role">' + t('pYou') + '</span>' : '') + '</b><span><bdi dir="ltr">@' + esc(a.u) + '</bdi></span></div>' +
      (owner ? '' : '<div class="acts"><button class="btn sm" type="button" data-act="reset">' + t('pReset') + '</button><button class="btn sm danger" type="button" data-act="remove">' + t('pRemove') + '</button></div>') + '</div>' +
      (owner ? '' : '<form class="p-reset" data-form="reset" data-u="' + esc(a.u) + '" hidden novalidate>' + pfield(t('pNew'), 'rp-' + esc(a.u), 'new-password', true) + '<button class="btn gold" type="submit">' + t('pResetGo') + '</button></form>') + '</li>';
  }).join('');
}
function peopleHtml(){
  var me = admin.me, owner = me.role === 'owner';
  var h = '<p class="msg" id="pe-msg" role="status" hidden></p>';
  h += '<section class="p-card"><h3 class="p-h">' + t('pAccount') + '</h3><div class="p-me"><b>' + esc(me.name) + '</b><span><bdi dir="ltr">@' + esc(me.u) + '</bdi> · ' + t(owner ? 'roleOwner' : 'roleAdmin') + '</span></div>' +
    '<details class="p-pw"><summary>' + t('pChangePw') + '</summary><form data-form="pw" novalidate>' + pfield(t('pCur'), 'pw-cur', 'current-password') + pfield(t('pNew'), 'pw-new', 'new-password') +
    pfield(t('pNew2'), 'pw-new2', 'new-password') + '<button class="btn gold" type="submit">' + t('pSavePw') + '</button></form></details></section>';
  if (owner) {
    h += '<section class="p-card"><h3 class="p-h">' + t('pTeam') + '</h3><p class="s-sub">' + t('pTeamSub') + '</p><ul class="p-list" id="pe-list">' + teamRows() + '</ul></section>';
    h += '<section class="p-card"><h3 class="p-h">' + t('pAdd') + '</h3><form data-form="add" novalidate>' +
      '<label for="ad-name"><b>' + t('pName') + '</b><input id="ad-name" type="text" autocomplete="off"></label>' +
      '<label for="ad-user"><b>' + t('pUser') + '</b><input id="ad-user" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>' +
      pfield(t('pPass'), 'ad-pass', 'new-password', true) + '<small class="s-sub">' + t('passHint') + '</small>' +
      '<button class="btn gold" type="submit">' + t('pAddGo') + '</button><div class="p-cred" id="pe-cred" hidden></div></form></section>';
  }
  return h;
}
function peopleRender(){
  $('#pe-title').textContent = t('pTitle');
  var keep = $('#pe-msg') && !$('#pe-msg').hidden ? { t: $('#pe-msg').textContent, c: $('#pe-msg').className } : null;
  $('#pe-body').innerHTML = peopleHtml();
  if (keep) { var m = $('#pe-msg'); m.textContent = keep.t; m.className = keep.c; m.hidden = false; }
  credShow();
}
function teamRefresh(){ var l = $('#pe-list'); if (l) l.innerHTML = teamRows(); }
function pmsg(text, bad){
  var m = $('#pe-msg'); if (!m) return;
  m.textContent = text; m.className = 'msg ' + (bad ? 'bad' : 'ok'); m.hidden = false;
  try { m.scrollIntoView({ block: 'nearest' }); } catch (e) {}
}
function credShow(){
  var box = $('#pe-cred'); if (!box) return;
  if (!credText) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = '<p>' + esc(t('pShare')) + '</p><pre>' + esc(credText) + '</pre><button class="btn sm gold" type="button" data-act="copycred">' + t('pCopy') + '</button>';
}
function openPeople(){
  if (!admin.on) return;
  team = null; credText = ''; peopleRender(); openD($('#people'));
  if (admin.me.role === 'owner') loadTeam();
}
function loadTeam(){
  return API.call('GET', '/api/admin?a=team').then(function(d){ team = d.team; teamRefresh(); }, function(e){
    if (e.status === 401) { onSignedOut(); closeD($('#people')); openAuth(); } else pmsg(errText(e), true);
  });
}
function peopleFail(e){
  if (e.status === 401 && e.code === 'signed_out') { onSignedOut(); closeD($('#people')); openAuth(); return; }
  pmsg(e.code === 'bad_login' && e.data && e.data.error ? t('eCurrent') : errText(e), true);
}
$('#pe-body').addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act, row = b.closest('.p-row');
  if (act === 'gen') {
    var inp = document.getElementById(b.dataset.for); inp.value = genPass(); inp.type = 'text';
    var sh = inp.parentNode.querySelector('[data-show]'); if (sh) showLabel(sh);
  } else if (act === 'reset') {
    var f = row.querySelector('.p-reset'); f.hidden = !f.hidden;
    if (!f.hidden) f.querySelector('input').focus();
  } else if (act === 'remove') {
    var u = row.dataset.u;
    if (!b.dataset.armed) {
      b.dataset.armed = '1'; b.textContent = t('pRemove2');
      setTimeout(function(){ if (b.isConnected) { delete b.dataset.armed; b.textContent = t('pRemove'); } }, 3000);
      return;
    }
    API.call('POST', '/api/admin', { a: 'removeAdmin', username: u }).then(function(d){ team = d.team; teamRefresh(); pmsg(t('pRemoved', u)); }, peopleFail);
  } else if (act === 'copycred') {
    copyText(credText).then(function(ok){ pmsg(t(ok ? 'pCopied' : 'pCopyFail'), !ok); });
  }
});
$('#pe-body').addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target, kind = f.dataset.form, btn = f.querySelector('[type=submit]');
  function val(id){ return document.getElementById(id).value; }
  function busy(on){ btn.disabled = on; }
  if (kind === 'pw') {
    if (val('pw-new') !== val('pw-new2')) { pmsg(t('pMismatch'), true); return; }
    busy(true);
    API.call('POST', '/api/admin', { a: 'changePw', current: val('pw-cur'), password: val('pw-new') }).then(function(){
      busy(false); f.reset(); f.querySelectorAll('input').forEach(function(i){ i.type = 'password'; }); f.parentNode.open = false; pmsg(t('pPwDone'));
    }, function(err){ busy(false); if (err.code === 'bad_login') pmsg(t('eCurrent'), true); else peopleFail(err); });
  } else if (kind === 'add') {
    var u = val('ad-user').trim().toLowerCase(), p = val('ad-pass');
    busy(true);
    API.call('POST', '/api/admin', { a: 'addAdmin', name: val('ad-name'), username: u, password: p }).then(function(d){
      busy(false); team = d.team; teamRefresh();
      credText = t('pShareTxt', location.origin + '/admin', u, p);
      f.reset(); document.getElementById('ad-pass').type = 'password'; credShow(); pmsg(t('pAdded', u));
    }, function(err){ busy(false); peopleFail(err); });
  } else if (kind === 'reset') {
    var ru = f.dataset.u, rp = f.querySelector('input').value;
    busy(true);
    API.call('POST', '/api/admin', { a: 'resetPw', username: ru, password: rp }).then(function(d){
      busy(false); team = d.team; teamRefresh();
      credText = t('pShareTxt', location.origin + '/admin', ru, rp); credShow(); pmsg(t('pResetDone', ru));
    }, function(err){ busy(false); peopleFail(err); });
  }
});
$('#pe-close').addEventListener('click', function(){ closeD($('#people')); });
$('#people').addEventListener('click', function(e){ if (e.target === this) closeD(this); });
$('#people').addEventListener('close', function(){ credText = ''; team = null; });

/* ---- on every page load: staff who signed in before are recognised again (the cookie does the real work) */
function initStaff(staffPage){
  var hint = store.get('kv-staff') === '1';
  if (!staffPage && !hint) return;
  API.call('GET', '/api/auth').then(function(s){
    if (s.me) { setMe(s.me); if (staffPage) openAdminPanel(); }
    else { store.del('kv-staff'); if (staffPage) openAuth(function(){ openAdminPanel(); }); }
  }, function(){ if (staffPage) openAuth(function(){ openAdminPanel(); }); });
}


/* ---------- start: show the built-in list at once (or the server's list if it answers within a blink), then keep it fresh */
(function(){
  var started = false;
  function start(cat){
    if (started) return;
    started = true;
    if (cat) applyCatalog(cat);
    applyLang();
    if (dropped) toast(t('tDropped'), true);
    var staffPage = location.pathname.replace(/\/+$/, '') === '/admin';
    if (!staffPage && store.get('kv-18') !== 'yes') { $('#gate').showModal(); document.documentElement.classList.add('lock'); }
    initStaff(staffPage);
  }
  var timer = setTimeout(function(){ start(null); }, 350);
  fetchCatalog().then(function(cat){
    if (!started) { clearTimeout(timer); start(cat); }
    else if (cat) applyCatalog(cat);
  });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && started && Date.now() - lastCatalog > 60000) fetchCatalog().then(function(cat){ if (cat) applyCatalog(cat); });
  });
})();
